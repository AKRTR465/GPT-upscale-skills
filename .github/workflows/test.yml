name: Test deterministic helpers
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: Run full 16K and 322 MP acceptance on Windows and Linux
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  stress:
    if: (github.event_name == 'workflow_dispatch' && inputs.stress) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:stress -- --work-dir work/stress --report work/stress-report.json
      - run: npm run test:stress -- --dimensions 37258x8640 --work-dir work/stress --report work/322mp-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ runner.os }}-large-canvas-acceptance
          path: |
            work/stress-report.json
            work/322mp-report.json
          if-no-files-found: warn
          retention-days: 14
